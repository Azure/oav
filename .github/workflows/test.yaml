name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          cache: "npm"
          node-version: 22

      - name: Install deps
        run: |
          echo "::group::npm ci"
          npm ci
          echo "::endgroup::"
          echo "::group::npm ls -a"
          npm ls -a || true
          echo "::endgroup::"
        shell: bash

      # script "build" also calls "lint"
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # dependencies

      # pinned to the most popular versions
      - dependency-name: "@azure/openapi-markdown"
      - dependency-name: "json-schema-traverse"

      # locked to "^6.12.6", for compat with our version of TypeScript
      - dependency-name: "ajv"

      # Locked to "^9.3.5", for compat with cjs
      - dependency-name: "glob"

      # locked to "^5.1.1", since newer majors include breaking changes that impact us
      - dependency-name: "inversify"

      # locked to "^6.3.0", since newer majors remove features we depend on
      - dependency-name: "path-to-regexp"

      # locked to ~3.16.0, since newer minors include an undocumented breaking change in typings that impacts us
      # https://github.com/winstonjs/winston/issues/2528
      - dependency-name: "winston"

      # locked to ^15.4.1, since newer majors include breaking changes that may impact us
      - dependency-name: "yargs"

      # devDependencies

      # locked to "^20.0.0" to align with our minimum node version in package.json/engines
      - dependency-name: "@types/node"

      # locked to "^8", since newer versions include breaking changes
      - dependency-name: "@typescript-eslint/eslint-plugin"
      - dependency-name: "@typescript-eslint/parser"
      - dependency-name: "eslint"

      # locked to "^29", for compat with our version of TypeScript
      - dependency-name: "@types/jest"
      - dependency-name: "jest"
      - dependency-name: "ts-jest"

      # locked since newer versions include breaking changes
      - dependency-name: "eslint-config-prettier"
      - dependency-name: "eslint-plugin-prettier"
      - dependency-name: "prettier"

      # locked to "~4.9.5", for compat with our TS code
      - dependency-name: "typescript"

      # overrides

      # locked to ~2.6.1, since newer minors include an undocumented breaking change in typings that impacts us
      # https://github.com/winstonjs/logform/issues/336
      - dependency-name: "logform"
